<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6e7c6">
  <title>奶了个蛙</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game-shell">
    <header class="topbar">
      <div class="brand"><span class="brand-icon" aria-hidden="true"><img src="assets/main-stance.png" alt=""></span><div><h1>奶了个蛙</h1><p id="level-name">第 1 关 · 热身塘</p></div></div>
      <div class="top-controls">
        <button type="button" id="bgm-button" class="bgm-button" aria-label="音乐开" aria-pressed="true"><span aria-hidden="true">♪</span><span class="bgm-label">音乐开</span></button>
        <div class="level-switch" role="group" aria-label="选择关卡">
          <button type="button" class="level-button active" data-level="1" aria-label="第 1 关 · 热身塘">1</button>
          <button type="button" class="level-button" data-level="2" aria-label="第 2 关 · 双荷塘" disabled>2</button>
          <button type="button" class="level-button" data-level="3" aria-label="第 3 关 · 深水塘" disabled>3</button>
          <button type="button" class="level-button" data-level="4" aria-label="第 4 关 · 迷雾塘" disabled>4</button>
          <button type="button" class="level-button" data-level="5" aria-label="第 5 关 · 中央塔" disabled>5</button>
          <button type="button" class="level-button" data-level="6" aria-label="第 6 关 · 环形阵" disabled>6</button>
          <button type="button" class="level-button" data-level="7" aria-label="第 7 关 · 终局高塔" disabled>7</button>
        </div>
        <div class="remaining" aria-live="polite"><span class="remaining-prefix">棋盘剩余 </span><strong id="remaining-count">24</strong><span class="remaining-suffix"> 张</span></div>
      </div>
    </header>
    <div class="progress-track" role="progressbar" aria-label="本关已消除进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="progress-fill" class="progress-fill"></div></div>

    <section class="play-area" aria-label="奶蛙牌局">
      <div class="board-wrap">
        <div class="board" id="board" aria-label="棋盘"><div class="loading" role="status">加载中…</div></div>
      </div>
      <div class="dock">
        <div class="held-row"><span class="row-label">暂存区</span><div class="held-cards" id="held" aria-label="暂存的牌"></div><span class="held-note">点牌可放回</span></div>
        <div class="slot-heading"><span>荷叶槽位</span><span id="slot-warning" class="slot-warning" aria-live="polite"></span></div>
        <div class="slot" id="slot" aria-label="七格槽位"></div>
        <div class="tools" role="group" aria-label="道具">
          <button type="button" id="undo-button" class="tool-button"><span class="tool-icon">↶</span><span>撤销 <small>剩 1 次</small></span></button>
          <button type="button" id="shuffle-button" class="tool-button"><span class="tool-icon">↝</span><span>洗牌 <small>剩 1 次</small></span></button>
          <button type="button" id="move-button" class="tool-button"><span class="tool-icon">⇥</span><span>移出 <small>剩 1 次</small></span></button>
          <button type="button" id="restart-button" class="restart-button">↻ 重新开始</button>
        </div>
      </div>
    </section>
  </main>

  <div class="modal-backdrop" id="result-modal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="result-title">
      <div id="result-frog" class="result-frog"></div>
      <h2 id="result-title"></h2>
      <p id="result-message"></p>
      <div class="modal-actions" id="result-actions"></div>
    </div>
  </div>

  <script src="game-logic.js"></script>
  <script src="game.js"></script>
</body>
</html>
